<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Tambah Anggota</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html"><i class="bi bi-book-half me-2"></i>SIMPUS-Mini</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html"><i class="bi bi-house-door me-1"></i>Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="../buku/list.html"><i class="bi bi-journals me-1"></i>Daftar Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="list.html"><i class="bi bi-people me-1"></i>Daftar Anggota</a></li>
                    <li class="nav-item"><a class="nav-link active" href="tambah.html"><i class="bi bi-person-plus me-1"></i>Tambah Anggota</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-4">
        <section class="card shadow-sm border-0">
            <div class="card-body">
                <h3 class="fw-bold mb-4" style="color:#1e3a8a;"><i class="bi bi-person-plus me-2"></i>Tambah Anggota Baru</h3>
                <form>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="no_anggota" class="form-label fw-semibold">No. Anggota</label>
                            <input type="text" class="form-control" id="no_anggota" name="no_anggota" placeholder="Contoh: A003" required>
                        </div>
                        <div class="col-md-6">
                            <label for="nama" class="form-label fw-semibold">Nama Lengkap</label>
                            <input type="text" class="form-control" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>
                        </div>
                        <div class="col-md-6">
                            <label for="no_hp" class="form-label fw-semibold">No. HP</label>
                            <input type="text" class="form-control" id="no_hp" name="no_hp" placeholder="Contoh: 08123456789">
                        </div>
                        <div class="col-md-6">
                            <label for="alamat" class="form-label fw-semibold">Alamat</label>
                            <input type="text" class="form-control" id="alamat" name="alamat" placeholder="Masukkan alamat ringkas">
                        </div>
                    </div>
                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary-custom px-4"><i class="bi bi-save me-1"></i>Simpan</button>
                        <a href="list.html" class="btn btn-light border px-4" style="border-radius: 8px;">Batal</a>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer class="text-center text-muted py-4 small">
        <p class="mb-0">&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 3 (Bootstrap)</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
